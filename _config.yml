# GitHub Pages Configuration
title: Agueda Schwartz | AI + Education Product Management
description: Case studies and methodology from an AI-augmented product management practice.
author: Agueda Schwartz

# Theme - clean and minimal
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# Build settings
